@if (dialog.current(); as request) {
  <div class="confirm-dialog__backdrop" (click)="cancel()">
    <div
      #panel
      class="confirm-dialog"
      [class.confirm-dialog--danger]="request.variant === 'danger'"
      role="alertdialog"
      aria-modal="true"
      aria-labelledby="confirm-dialog-title"
      aria-describedby="confirm-dialog-message"
      (click)="$event.stopPropagation()"
    >
      <div class="confirm-dialog__icon" aria-hidden="true">
        @if (request.variant === 'danger') {
          <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M10.29 3.86 1.82 18a2 2 0 0 0 1.71 3h16.94a2 2 0 0 0 1.71-3L13.71 3.86a2 2 0 0 0-3.42 0z" />
            <path d="M12 9v4M12 17h.01" />
          </svg>
        } @else {
          <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <circle cx="12" cy="12" r="10" />
            <path d="M9.09 9a3 3 0 0 1 5.83 1c0 2-3 3-3 3M12 17h.01" />
          </svg>
        }
      </div>

      <div class="confirm-dialog__body">
        <h2 id="confirm-dialog-title" class="confirm-dialog__title">{{ request.title }}</h2>
        <p id="confirm-dialog-message" class="confirm-dialog__message">{{ request.message }}</p>
        @if (request.subject) {
          <p class="confirm-dialog__subject">{{ request.subject }}</p>
        }
      </div>

      <div class="confirm-dialog__actions">
        <button #cancelButton type="button" class="confirm-dialog__button" (click)="cancel()">
          {{ request.cancelText }}
        </button>
        <button
          #confirmButton
          type="button"
          class="confirm-dialog__button confirm-dialog__button--confirm"
          (click)="confirm()"
        >
          {{ request.confirmText }}
        </button>
      </div>
    </div>
  </div>
}
