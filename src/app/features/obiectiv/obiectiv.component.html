<div class="obiectiv">
  <ng-container *ngIf="!authService.isAuthenticated()">
    <p class="obiectiv__hint">Autentifică-te pentru a gestiona obiectivele.</p>
  </ng-container>

  <div *ngIf="authService.isAuthenticated()" class="obiectiv__layout">
    <nav class="obiectiv__menu">
      <button
        type="button"
        class="obiectiv__menu-item"
        [class.obiectiv__menu-item--active]="mode() === 'create'"
        (click)="selectMode('create')"
      >
        Creează Obiectiv
      </button>
      <button
        type="button"
        class="obiectiv__menu-item"
        [class.obiectiv__menu-item--active]="mode() === 'update'"
        (click)="selectMode('update')"
      >
        Modifică Obiectiv
      </button>
      <button
        type="button"
        class="obiectiv__menu-item"
        [class.obiectiv__menu-item--active]="mode() === 'delete'"
        (click)="selectMode('delete')"
      >
        Șterge Obiectiv
      </button>
    </nav>

    <form class="obiectiv__form" [formGroup]="form" (ngSubmit)="submit()">
      <label class="obiectiv__field">
        <span>Nume</span>
        <input *ngIf="mode() === 'create'" type="text" formControlName="nume" autocomplete="off" />
        <select
          *ngIf="mode() !== 'create'"
          [disabled]="isLoadingObiective()"
          (change)="onObiectivSelected($event)"
        >
          <option value="">{{ isLoadingObiective() ? 'Se încarcă...' : 'Selectează obiectivul' }}</option>
          <option *ngFor="let o of obiective()" [value]="o.id">{{ o.nume }}</option>
        </select>
      </label>

      <label class="obiectiv__field">
        <span>Alias</span>
        <input type="text" formControlName="alias" autocomplete="off" />
      </label>

      <label class="obiectiv__field">
        <span>Termen execuție</span>
        <input type="date" formControlName="termenExecutie" />
      </label>

      <label class="obiectiv__field">
        <span>Data începere</span>
        <input type="date" formControlName="dataIncepere" />
      </label>

      <p *ngIf="dateRangeError()" class="obiectiv__field-error">{{ dateRangeError() }}</p>

      <div class="obiectiv__actions">
        <button
          class="obiectiv__submit"
          [class.obiectiv__submit--danger]="mode() === 'delete'"
          type="submit"
          [disabled]="isSubmitting() || (mode() !== 'create' && !selectedObiectivId())"
        >
          {{ submitLabel() }}
        </button>

        <p *ngIf="errorMessage()" class="obiectiv__error">{{ errorMessage() }}</p>
        <p *ngIf="successMessage()" class="obiectiv__success">{{ successMessage() }}</p>
      </div>
    </form>
  </div>
</div>
