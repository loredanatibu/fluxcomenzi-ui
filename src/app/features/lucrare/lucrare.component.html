<div class="lucrare">
  <ng-container *ngIf="!authService.isAuthenticated()">
    <p class="lucrare__hint">Autentifică-te pentru a gestiona lucrările.</p>
  </ng-container>

  <div *ngIf="authService.isAuthenticated()" class="lucrare__layout">
    <nav class="lucrare__menu">
      <button
        type="button"
        class="lucrare__menu-item"
        [class.lucrare__menu-item--active]="mode() === 'create'"
        (click)="selectMode('create')"
      >
        Creează Lucrare
      </button>
      <button
        type="button"
        class="lucrare__menu-item"
        [class.lucrare__menu-item--active]="mode() === 'update'"
        (click)="selectMode('update')"
      >
        Modifică Lucrare
      </button>
      <button
        type="button"
        class="lucrare__menu-item"
        [class.lucrare__menu-item--active]="mode() === 'delete'"
        (click)="selectMode('delete')"
      >
        Șterge Lucrare
      </button>
    </nav>

    <form class="lucrare__form" [formGroup]="form" (ngSubmit)="submit()">
      <label class="lucrare__field">
        <span>Obiectiv<span class="required-marker">*</span></span>
        <app-combo-select
          formControlName="idObiectiv"
          [options]="obiectivOptions()"
          [loading]="isLoadingObiective()"
          [selectOnly]="mode() !== 'create'"
          placeholder="Alege un obiectiv"
        ></app-combo-select>
      </label>

      <label class="lucrare__field">
        <span>Nume<span class="required-marker">*</span></span>
        <input *ngIf="mode() === 'create'" type="text" formControlName="nume" autocomplete="off" />
        <app-combo-select
          *ngIf="mode() !== 'create'"
          [options]="lucrareOptions()"
          [loading]="isLoadingLucrari()"
          [value]="selectedLucrareId()"
          [disabled]="!selectedIdObiectiv()"
          [selectOnly]="mode() === 'delete'"
          [freeText]="mode() === 'update'"
          placeholder="Selectează lucrarea"
          (valueChange)="onLucrareSelected($event)"
          (queryChange)="onLucrareNameEdited($event)"
        ></app-combo-select>
      </label>

      <div class="lucrare__actions">
        <button
          class="lucrare__submit"
          [class.lucrare__submit--danger]="mode() === 'delete'"
          type="submit"
          [disabled]="isSubmitting() || (mode() === 'create' ? formInvalid() : !selectedLucrareId())"
        >
          {{ submitLabel() }}
        </button>

        <p *ngIf="errorMessage()" class="lucrare__error">{{ errorMessage() }}</p>
        <p *ngIf="successMessage()" class="lucrare__success">{{ successMessage() }}</p>
      </div>
    </form>
  </div>
</div>
