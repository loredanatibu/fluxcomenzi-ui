<div class="shell">
  <header class="shell__topbar">
    <app-nav></app-nav>
  </header>

  <div *ngIf="!authService.isAuthenticated()" class="shell__auth">
    <app-login></app-login>
  </div>

  <main class="shell__content">
    <router-outlet></router-outlet>
  </main>

  <footer *ngIf="authService.isAuthenticated() || authService.loginError()" class="shell__footer">
    <div *ngIf="authService.isAuthenticated()" class="shell__user">
      <span>{{ authService.currentEmail() }}</span>
      <button type="button" (click)="authService.logout()">Logout</button>
    </div>

    <span *ngIf="!authService.isAuthenticated() && authService.loginError()" class="shell__footer-error">
      {{ authService.loginError() }}
    </span>
  </footer>
</div>
