server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_types text/plain text/css application/javascript application/json;

    # SPA: let Angular's router handle unknown paths client-side.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # index.html must be revalidated on every load: it names the hashed main-*.js of the
    # current build, so a cached copy keeps serving the previous build after a redeploy.
    # (Also hit by "/" and the SPA fallback above, both internal redirects to it.)
    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    # Runtime config must never be cached -- it's regenerated per container.
    location = /assets/env.js {
        add_header Cache-Control "no-store";
    }
}
